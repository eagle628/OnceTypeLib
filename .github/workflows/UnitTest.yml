name: Unit Test

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: "Test (Windows: all TFMs)"
        if: runner.os == 'Windows'
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults-${{ matrix.os }}
      - name: "Test (Linux: no net462)"
        if: runner.os != 'Windows'
        run: dotnet test --no-build -c Release -f net10.0 --logger trx --results-directory TestResults-${{ matrix.os }}